# Baut bei jedem Push eine unsignierte .ipa und veröffentlicht sie als GitHub-Release.
# Signiert wird später auf dem iPhone durch SideStore.

name: IPA bauen

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Nötig, damit der Workflow ein Release anlegen darf.
permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: XcodeGen installieren
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Xcode-Projekt aus project.yml erzeugen
        run: xcodegen generate

      - name: App bauen (unsigniert)
        run: |
          xcodebuild build \
            -quiet \
            -project OhneReels.xcodeproj \
            -scheme OhneReels \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: .ipa packen
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OhneReels.app Payload/
          zip -qry OhneReels.ipa Payload
          ls -lh OhneReels.ipa

      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" OhneReels.ipa \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Ohne Reels – Build ${{ github.run_number }}" \
            --notes "Automatisch gebaut. OhneReels.ipa herunterladen und mit SideStore installieren (siehe README)."
